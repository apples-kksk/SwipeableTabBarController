name: PR 127 validation

"on":
  push:
    branches:
      - ci/pr127-xcodebuild-20260516
  workflow_dispatch:

jobs:
  xcodebuild:
    name: Xcode build and UI tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Select iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          udid="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as file:
              data = json.load(file)

          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit

          raise SystemExit("No available iPhone simulator found")
          PY
          )"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: List project schemes
        run: xcodebuild -list -project Example.xcodeproj

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Example.xcodeproj \
            -scheme Example \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            test
